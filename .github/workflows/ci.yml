name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Show toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Build Aqua.app
        run: scripts/build-app.sh
      - name: Package
        run: ditto -c -k --keepParent build/Aqua.app build/Aqua.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Aqua
          path: build/Aqua.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build Aqua.app
        run: scripts/build-app.sh
      - name: Package
        run: |
          ditto -c -k --keepParent build/Aqua.app "build/Aqua-${GITHUB_REF_NAME}.zip"
          shasum -a 256 "build/Aqua-${GITHUB_REF_NAME}.zip" > "build/Aqua-${GITHUB_REF_NAME}.zip.sha256"
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Aqua $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" "build/Aqua-${GITHUB_REF_NAME}.zip" "build/Aqua-${GITHUB_REF_NAME}.zip.sha256" --clobber
